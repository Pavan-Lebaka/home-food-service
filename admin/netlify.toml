[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://bramarambika-backend.onrender.com/api"
  VITE_STOREFRONT_URL = "https://bramarambika-home-food.netlify.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css"
